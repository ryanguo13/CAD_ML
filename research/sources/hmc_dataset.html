    <script nonce="GMhOBj2W+yO0Gh/+RxbGxQ==" type="application/ld+json">{"@context":"http://schema.org/","@type":"Dataset","name":"HMC-QU Dataset","description":"# 💻Implementation of [P1] along with the features extracted from the recordings available at https://github.com/degerliaysen/MultiEchoAI.\n\n# 💾For access to the dataset, please request access by sending e-mail to mkiranyaz@qu.edu.qa\n\n# **HMC-QU Dataset** \n\nThe HMC-QU benchmark dataset is created by the collaboration between Hamad Medical Corporation (HMC), Tampere University, and Qatar University. The dataset was created using the de-identified patient echocardiography from Hayatabad Medical Complex (HMC) and Indus Hospital in Pakistan and the usage of data has been approved by the local ethics board. It includes a collection of apical 4-chamber (A4C) and apical 2-chamber (A2C) view 2D echocardiography recordings obtained during the years 2018 and 2019.  \nIn total, the dataset comprises 322 echocardiography video recordings collected from 162 unique patients, including 93 myocardial infarction (MI) patients and 69 non-MI patients. It includes 162 apical 4-chamber (A4C) recordings (93 MI and 69 non-MI) and 160 apical 2-chamber (A2C) recordings (80 MI and 80 non-MI). Additionally, a subset of 109 A4C recordings provides frame-by-frame left ventricular segmentation masks for detailed left ventricular analysis.\nThe echocardiography recordings are acquired via devices from different vendors that are Phillips and GE Vivid (GE-Health-USA) ultrasound machines. The temporal resolution (frame rate per second) of the echocardiography recordings is 25 fps. The spatial resolution varies from 422x636 to 768x1024 pixels. The dataset can be utilized for both myocardial infarction (heart attack) detection and left ventricle wall segmentation purposes.\n\n##1. Detection of Myocardial Infarction \nHMC-QU is the first dataset that is shared with the research community serving myocardial infarction (MI) detection on the left ventricle wall of the heart. The recordings are from over 10,000 echos performed in a year including more than 800 cases admitted with acute ST-elevation MI. The patients with MI were treated with coronary angiogram/angioplasty after the diagnosis of acute MI with electrocardiography and cardiac enzymes evidence. The patients had echocardiography recordings obtained within 24 hours of admission or in some cases before they underwent coronary angioplasty. The subjects not diagnosed with MI underwent a required health check and investigation for other reasons in the hospital. \n\nThe ground-truth labels are provided for each myocardial segment illustrated in Figure 1 as non-MI and MI, where the MI term indicates any sign of regional wall motion abnormality, whereas the subjects without regional wall motion abnormality are assigned to non-MI. The one cardiac cycle frames are predefined for each recording. End-diastole and end-systole frames are defined according to the electrocardiography (ECG) recordings of the patients. For the patients without ECG recordings, the cardiac cycle is defined according to the frames, where the left ventricle area is the largest and smallest. \n\n###1.1. Apical 4-chamber\nThe dataset consists of 162 A4C view 2D echocardiography recordings.\n\n###1.2. Apical 2-chamber\nThe dataset consists of 160 A2C view 2D echocardiography recordings.\n\n![](https://www.googleapis.com/download/storage/v1/b/kaggle-user-content/o/inbox%2F1604467%2Fb99670ba477b528312a417727c7b5c90%2F17_segments_diagram.png?generation=1699189993331577&amp;alt=media)\n\n*Figure adapted from [P1]\n\n##2. Segmentation of the Left Ventricle Wall\nA subset of 109 A4C view echocardiography recordings has their corresponding ground-truth segmentation masks for the whole left ventricle wall at each frame for one cardiac cycle. This subset includes 72 MI patients and 37 non-MI subjects. The size of the ground-truth segmentation masks is 224x224 in order to have suitable input dimensions for many state-of-the-art deep network topologies. \n\n###If you use the dataset in your research, please consider citing the publications below:\n[P1] A. Degerli, S. Kiranyaz, T. Hamid, R. Mazhar, and M. Gabbouj, “Early Myocardial Infarction Detection over Multi-view Echocardiography,” Biomedical Signal Processing and Control, vol. 87, 2024, https://doi.org/10.1016/j.bspc.2023.105448.\n[P2] A. Degerli, M. Zabihi, S. Kiranyaz, T. Hamid, R. Mazhar, R. Hamila, and M. Gabbouj, \"Early Detection of Myocardial Infarction in Low-Quality Echocardiography,\" in IEEE Access, vol. 9, pp. 34442-34453, 2021, https://doi.org/10.1109/ACCESS.2021.3059595.\n[P3] S. Kiranyaz, A. Degerli, T. Hamid, R. Mazhar, R. E. F. Ahmed, R. Abouhasera, M. Zabihi, J. Malik, R. Hamila, and M. Gabbouj, \"Left Ventricular Wall Motion Estimation by Active Polynomials for Acute Myocardial Infarction Detection,\" in IEEE Access, vol. 8, pp. 210301-210317, 2020, https://doi.org/10.1109/ACCESS.2020.3038743.\n[P4] I. Adalioglu, M. Ahishali, A. Degerli, S. Kiranyaz and M. Gabbouj, \"SAF-Net: Self-Attention Fusion...","url":"https://www.kaggle.com/aysendegerli/hmcqu-dataset","version":6,"keywords":["data type, image","task, classification","subject, health and fitness, health","technique, computer vision","subject, health and fitness, health, health conditions, heart conditions"],"license":{"@type":"CreativeWork","name":"Attribution-NonCommercial-ShareAlike 3.0 IGO (CC BY-NC-SA 3.0 IGO)","url":"https://creativecommons.org/licenses/by-nc-sa/3.0/igo/"},"identifier":["1150480"],"includedInDataCatalog":{"@type":"DataCatalog","name":"Kaggle","url":"https://www.kaggle.com"},"creator":{"@type":"Person","name":"aysendegerli","url":"https://www.kaggle.com/aysendegerli","image":"https://storage.googleapis.com/kaggle-avatars/thumbnails/default-thumb.png"},"distribution":[{"@type":"DataDownload","requiresSubscription":true,"encodingFormat":"zip","fileFormat":"zip","contentUrl":"https://www.kaggle.com/datasets/a
